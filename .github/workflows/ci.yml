# ChampBeam CI gate.
#
# Runs on every pull request and on every push to `staging` (Railway test) and
# `main` (Deepify prod). Nothing deploys unless this is green:
#   * Railway: enable "Wait for CI" on the service (Settings -> Deploy ->
#     Check Suites) so a red run blocks the test deploy.
#   * Coolify (prod): auto-deploy is OFF on the app; the `deploy-prod` job below
#     calls the Coolify deploy webhook only after every check passes on main.
#   * Vercel: set "Ignored Build Step" to skip previews on draft PRs if wanted;
#     production builds come from `main` and are already behind this gate via
#     branch protection (require the `ci / gate` check).
#
# Secrets used (repo -> Settings -> Secrets and variables -> Actions):
#   COOLIFY_DEPLOY_WEBHOOK   the app's "Deploy webhook" URL from Coolify
#   COOLIFY_API_TOKEN        a Coolify API token (Keys & Tokens), deploy scope
#   PROD_HEALTH_URL          https://share.lakeb2b.com/health (or the sslip host)

name: ci

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Alembic heads are linear
        run: |
          heads=$(alembic heads 2>/dev/null | wc -l)
          if [ "$heads" -ne 1 ]; then echo "::error::alembic has $heads heads; merge them"; alembic heads; exit 1; fi
      - run: python -m pytest -q -p no:cacheprovider

  frontend:
    name: frontend (tsc, vitest, eslint)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint -- --max-warnings=200   # ratchet this down over time; 61 today
      - run: npm run test
      - name: Production build
        run: npm run build
        env:
          VITE_API_URL: https://example.invalid
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_build_only

  image:
    name: backend image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gate:
    # Single required status check for branch protection.
    name: gate
    needs: [backend, frontend, image]
    runs-on: ubuntu-latest
    steps:
      - run: echo "all checks green"

  deploy-prod:
    name: deploy prod (Coolify)
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Coolify deploy
        run: |
          curl -fsS -X GET "${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
      - name: Wait for the new build to answer /health
        run: |
          for i in $(seq 1 40); do
            sleep 15
            body=$(curl -sS -m 10 "${{ secrets.PROD_HEALTH_URL }}" || true)
            echo "$i: $body"
            echo "$body" | grep -q '"healthy"' && exit 0
          done
          echo "::error::prod never reported healthy after deploy"; exit 1
