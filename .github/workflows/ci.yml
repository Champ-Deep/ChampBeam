# ChampBeam CI gate.
#
# Runs on every pull request and on every push to `staging` and `main`.
# Deploys are owned by the platforms, gated by this workflow:
#   * Railway (backend, prod and Testing): enable "Wait for CI" on the service
#     (Settings -> Deploy -> Check Suites) so a red run blocks the deploy.
#   * Vercel (frontend): production builds come from `main`, behind branch
#     protection that requires the `gate` check.
# No deploy secrets are needed here. Coolify deploy job removed 2026-10-17;
# the compose files under deploy/coolify stay as reference only.

name: ci

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Alembic heads are linear
        run: |
          heads=$(alembic heads 2>/dev/null | wc -l)
          if [ "$heads" -ne 1 ]; then echo "::error::alembic has $heads heads; merge them"; alembic heads; exit 1; fi
      - run: python -m pytest -q -p no:cacheprovider

  frontend:
    name: frontend (tsc, vitest, eslint)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint -- --max-warnings=200   # ratchet this down over time; 61 today
      - run: npm run test
      - name: Production build
        run: npm run build
        env:
          VITE_API_URL: https://example.invalid
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_build_only

  worker:
    name: worker (tsc, vitest)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: worker }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # Workers Builds and local development use 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node scripts/check-env-overlays.mjs
      - run: npx vitest run

  image:
    name: backend image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gate:
    # Single required status check for branch protection.
    name: gate
    needs: [backend, frontend, worker, image]
    runs-on: ubuntu-latest
    steps:
      - run: echo "all checks green"
