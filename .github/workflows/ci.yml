name: ci

on:
  push:
    branches: [main, v2-consolidation]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    # The redirect-lookup tests exercise SQLAlchemy query construction, and the
    # org-scoping fix depends on Postgres NULL ordering, which SQLite sorts the
    # other way round. Pin Postgres so CI matches production instead of silently
    # passing on a different database engine.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: champbeam
          POSTGRES_PASSWORD: champbeam
          POSTGRES_DB: champbeam
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://champbeam:champbeam@localhost:5432/champbeam
      TESTING: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run test suite
        run: python -m pytest -q

  frontend:
    name: Frontend (typecheck + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `tsc -b` runs first as part of the build script, so a type error fails
      # here rather than shipping a broken bundle.
      - name: Typecheck and build
        run: npm run build

      - name: Test
        run: npm test

  status:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] ||
             [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "One or more checks failed"
            exit 1
          fi
          echo "All checks passed successfully!"
