# LEGACY nixpacks config, used only while the Railway service's Root Directory
# is the repo root. The target setup is Root Directory = backend, which makes
# Railway read backend/railway.toml and build backend/Dockerfile (same image as
# prod). Once that setting is flipped and a staging deploy is green, delete this
# file, the Procfile and the root requirements.txt together.
[build]
builder = "nixpacks"

[deploy]
startCommand = "cd backend && PYTHONPATH=. python scripts/bootstrap_db.py && alembic upgrade head && PYTHONPATH=. python scripts/ensure_geoip.py && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
