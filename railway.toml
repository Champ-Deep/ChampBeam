[build]
builder = "nixpacks"

[deploy]
startCommand = "cd backend && PYTHONPATH=. python scripts/bootstrap_db.py && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
