# LEGACY nixpacks config for the FastAPI app. Production is the Cloudflare
# Worker in worker/ (https://champbeam.com), not this file. A leftover Railway
# service can set CF_REDIRECT_BASE to hand public requests to the Worker
# (backend/app/middleware/cf_redirect.py). This start command still boots
# the Python app when that variable is unset.
[build]
builder = "nixpacks"

[deploy]
startCommand = "cd backend && PYTHONPATH=. python scripts/bootstrap_db.py && alembic upgrade head && PYTHONPATH=. python scripts/ensure_geoip.py && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
